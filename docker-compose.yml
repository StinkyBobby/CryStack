services:
  db:
    image: postgres:15-alpine
    container_name: crystack_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234" 
      POSTGRES_DB: crystack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: ./backend
    container_name: crystack_app
    restart: always
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db
    environment:
      DB_URL: ${DB_URL}
      STEAM_API_KEY: ${STEAM_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DOMAIN: ${DOMAIN}
      PORT: ${PORT}
      VITE_PORT: ${VITE_PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}

  frontend:
      build: ./frontend
      container_name: crystack_ui
      restart: always
      ports:
        - "${VITE_PORT}:${VITE_PORT}" 
      volumes:
        - ./frontend:/app             
        - /app/node_modules           
      environment:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_PORT=${VITE_PORT}
        - CHOKIDAR_USEPOLLING=true    
      depends_on:
        - app
      stdin_open: true 
      tty: true    


volumes:
  postgres_data:
